<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Page Pulse - Fast URL Auditor</title>
        <style>
            :root {
                  --bg: #0f172a;
                        --card-bg: #1e293b;
                              --border: #334155;
                                    --accent: #38bdf8;
                                          --text: #f8fafc;
                                                --muted: #94a3b8;
                                                      --error: #f87171;
                                                            --success: #4ade80;
                                                                }

                                                                    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
                                                                        body { 
                                                                              background-color: var(--bg); 
                                                                                    color: var(--text); 
                                                                                          padding: 2rem 1rem; 
                                                                                                display: flex; 
                                                                                                      flex-direction: column;
                                                                                                            align-items: center;
                                                                                                                  min-height: 100vh;
                                                                                                                      }
                                                                                                                          .container { max-width: 720px; width: 100%; flex: 1; }
                                                                                                                              
                                                                                                                                  header { margin-bottom: 2rem; text-align: center; }
                                                                                                                                      header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; color: var(--accent); }
                                                                                                                                          header p { color: var(--muted); }

                                                                                                                                              .search-box { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
                                                                                                                                                  input[type="text"] {
                                                                                                                                                        flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border);
                                                                                                                                                              background: var(--card-bg); color: var(--text); font-size: 1rem; outline: none;
                                                                                                                                                                  }
                                                                                                                                                                      input[type="text"]:focus { border-color: var(--accent); }
                                                                                                                                                                          button {
                                                                                                                                                                                padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: var(--accent);
                                                                                                                                                                                      color: #0284c7; font-weight: 600; font-size: 1rem; cursor: pointer; transition: opacity 0.2s;
                                                                                                                                                                                          }
                                                                                                                                                                                              button:hover { opacity: 0.9; }
                                                                                                                                                                                                  button:disabled { opacity: 0.5; cursor: not-allowed; }

                                                                                                                                                                                                      .error-card {
                                                                                                                                                                                                            background: rgba(248, 113, 113, 0.1); border: 1px solid var(--error);
                                                                                                                                                                                                                  color: var(--error); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: none;
                                                                                                                                                                                                                      }

                                                                                                                                                                                                                          .report-card {
                                                                                                                                                                                                                                background: var(--card-bg); border: 1px solid var(--border);
                                                                                                                                                                                                                                      border-radius: 12px; padding: 1.5rem; display: none;
                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                              .report-header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem; }
                                                                                                                                                                                                                                                  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
                                                                                                                                                                                                                                                      .stat-box { background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
                                                                                                                                                                                                                                                          .stat-label { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
                                                                                                                                                                                                                                                              .stat-value { font-size: 1.25rem; font-weight: 600; color: var(--text); }
                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                      .status-200 { color: var(--success); }
                                                                                                                                                                                                                                                                          .status-bad { color: var(--error); }
                                                                                                                                                                                                                                                                              .field-group { margin-bottom: 1rem; }
                                                                                                                                                                                                                                                                                  .field-group label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
                                                                                                                                                                                                                                                                                      .field-group p { background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 6px; font-size: 0.95rem; }

                                                                                                                                                                                                                                                                                          footer {
                                                                                                                                                                                                                                                                                                margin-top: 3rem;
                                                                                                                                                                                                                                                                                                      padding-top: 1rem;
                                                                                                                                                                                                                                                                                                            border-top: 1px solid var(--border);
                                                                                                                                                                                                                                                                                                                  text-align: center;
                                                                                                                                                                                                                                                                                                                        font-size: 0.85rem;
                                                                                                                                                                                                                                                                                                                              color: var(--muted);
                                                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                                          max-width: 720px;
                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                  footer a { color: var(--accent); text-decoration: none; }
                                                                                                                                                                                                                                                                                                                                                      footer a:hover { text-decoration: underline; }
                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                        <div class="container">
                                                                                                                                                                                                                                                                                                                                                          <header>
                                                                                                                                                                                                                                                                                                                                                              <h1>Page Pulse</h1>
                                                                                                                                                                                                                                                                                                                                                                  <p>Audit page latency, SEO basics, and structural health.</p>
                                                                                                                                                                                                                                                                                                                                                                    </header>

                                                                                                                                                                                                                                                                                                                                                                      <form id="auditForm" class="search-box">
                                                                                                                                                                                                                                                                                                                                                                          <input type="text" id="urlInput" placeholder="https://example.com" required />
                                                                                                                                                                                                                                                                                                                                                                              <button type="submit" id="submitBtn">Audit</button>
                                                                                                                                                                                                                                                                                                                                                                                </form>

                                                                                                                                                                                                                                                                                                                                                                                  <div id="errorBox" class="error-card"></div>

                                                                                                                                                                                                                                                                                                                                                                                    <div id="reportCard" class="report-card">
                                                                                                                                                                                                                                                                                                                                                                                        <div class="report-header">
                                                                                                                                                                                                                                                                                                                                                                                              <h2 id="reportUrl" style="word-break: break-all; font-size: 1.1rem; color: var(--accent);"></h2>
                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                      <div class="field-group">
                                                                                                                                                                                                                                                                                                                                                                                                            <label>Page Title</label>
                                                                                                                                                                                                                                                                                                                                                                                                                  <p id="reportTitle">--</p>
                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="field-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Meta Description</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                      <p id="reportMeta">--</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="meta-grid">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="stat-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-label">HTTP Status</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="stat-value" id="reportStatus">--</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="stat-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="stat-label">Response Time</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="stat-value" id="reportTime">--</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="stat-label">H1 Headings</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-value" id="reportH1">--</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="stat-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="stat-label">Images Missing Alt</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="stat-value" id="reportAlt">--</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="stat-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="stat-label">Approx. Word Count</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="stat-value" id="reportWords">--</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p><a href="https://digitalheroesco.com" target="_blank" rel="noopener noreferrer">Built for Digital Heroes Training Task</a></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const form = document.getElementById('auditForm');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const urlInput = document.getElementById('urlInput');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const submitBtn = document.getElementById('submitBtn');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const errorBox = document.getElementById('errorBox');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const reportCard = document.getElementById('reportCard');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              form.addEventListener('submit', async (e) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          errorBox.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              reportCard.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  submitBtn.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      submitBtn.textContent = 'Auditing...';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const response = await fetch('/api/audit', {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        method: 'POST',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                headers: { 'Content-Type': 'application/json' },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        body: JSON.stringify({ url: urlInput.value })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const data = await response.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (!response.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  throw new Error(data.error || 'Failed to analyze the page.');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('reportUrl').textContent = data.url;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('reportTitle').textContent = data.title || 'None found';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('reportMeta').textContent = data.metaDescription || 'None found';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const statusEl = document.getElementById('reportStatus');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            statusEl.textContent = data.httpStatus;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  statusEl.className = `stat-value ${data.httpStatus === 200 ? 'status-200' : 'status-bad'}`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('reportTime').textContent = `${data.responseTimeMs} ms`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('reportH1').textContent = data.h1Count;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('reportAlt').textContent = `${data.imagesMissingAlt} / ${data.totalImages}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('reportWords').textContent = data.wordCount.toLocaleString();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                reportCard.style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          errorBox.textContent = err.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                errorBox.style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } finally {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          submitBtn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                submitBtn.textContent = 'Audit';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </html>
